# Ortholab 2 — servidor AWS São Paulo (ortholab2.estheticaligner.com.br)
# Uso: cd deploy && ./setup.sh   (só na primeira vez)  ->  docker compose up -d --build
name: ortholab2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ortholab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ortholab_db
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5433:5432"   # só acessível de dentro do servidor (importador)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ortholab -d ortholab_db"]
      interval: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ortholab:${POSTGRES_PASSWORD}@postgres:5432/ortholab_db
      NODE_ENV: production
      PORT: "3001"
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/packages/backend/uploads

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?defina no .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
