services:
  postgres:
    image: postgres:16-alpine
    container_name: ortholab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ortholab
      POSTGRES_PASSWORD: ortholab123
      POSTGRES_DB: ortholab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: ortholab_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ortholab
      MINIO_ROOT_PASSWORD: ortholab123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data


volumes:
  postgres_data:
  minio_data:
