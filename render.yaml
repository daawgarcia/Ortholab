services:
  - type: web
    name: ortholab-backend
    runtime: node
    plan: free
    buildCommand: cd packages/backend && npm install && npm run db:generate && npm run build
    startCommand: cd packages/backend && npx prisma db push && node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ortholab-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://ortholab-frontend.onrender.com
      - key: APP_URL
        value: https://ortholab-frontend.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@estheticaligner.com.br
      - key: S3_ENDPOINT
        value: s3.amazonaws.com
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: ortholab-files
      - key: TOTVS_ENABLED
        value: "false"

  - type: pserv
    name: ortholab-postgres
    plan: free
    ipAllowList: []
    postgresMajorVersion: 15

  - type: web
    name: ortholab-frontend
    runtime: static
    plan: free
    buildCommand: cd packages/frontend && npm install && npm run build
    staticPublishPath: packages/frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ortholab-backend.onrender.com

  - type: redis
    name: ortholab-redis
    plan: free
    ipAllowList: []
