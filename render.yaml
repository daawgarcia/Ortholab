services:
  - type: web
    name: ortholab-backend
    runtime: node
    plan: standard
    buildCommand: npm install && cd packages/backend && npm run db:generate && npm run build
    startCommand: cd packages/backend && npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ortholab-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://ortholab-frontend.vercel.app
      - key: APP_URL
        value: https://ortholab-frontend.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Esthetic Aligner <noreply@estheticaligner.com.br>
      - key: S3_ENDPOINT
        value: s3.amazonaws.com
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: ortholab-files
      - key: S3_REGION
        value: us-east-1
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: REDE_WEBHOOK_AUTH
        sync: false
      - key: REDE_PV
        sync: false
      - key: REDE_TOKEN
        sync: false
      - key: REDE_ENV
        value: sandbox
      - key: TOTVS_ENABLED
        value: "false"
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: pserv
    name: ortholab-postgres
    plan: standard
    ipAllowList: []
    postgresMajorVersion: 15

  - type: redis
    name: ortholab-redis
    plan: standard
    ipAllowList: []
